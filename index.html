<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CueCommander</title>
    <!-- Import JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/grid.css" />
    <link rel="stylesheet" href="css/modules.css" />
    <link rel="stylesheet" href="css/tooltip.css" />
</head>
<body>
<!-- Start screen: the app needs a script before the grid means anything -->
<div id="loader" class="loader">
    <h1>CueControl</h1>
    <p>Choose a Fountain script to load.</p>
    <input type="file" id="file-input" accept=".fountain,.txt,.spmd" />
    <p class="hint">No script to hand? Load <code>sample.fountain</code> from this repo.</p>
</div>
<!-- Grid wrapper: background grid and module overlay -->
<div id="grid-wrapper" class="grid-wrapper">
    <div id="grid-container" class="grid-container"></div>
    <div id="module-layer" class="module-layer"></div>
</div>
<!-- Global tooltip for right-click actions -->
<div id="tooltip" class="tooltip"></div>
<script type="module" src="script.js"></script>
</body>
</html>
